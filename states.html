<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#140c08;--panel:#1f140d;--border:rgba(224,166,59,.12);--gold:#d4a853;--muted:#8d7258;--text:#f2e8db}
body{background:var(--bg);color:var(--text);font-family:'Lora',serif}
.container{width:1180px;max-width:92%;margin:auto;padding-bottom:90px}
.navbar{display:flex;justify-content:space-between;align-items:center;padding:28px 0;margin-bottom:40px}
.logo{text-decoration:none;font-family:'Playfair Display',serif;font-size:34px;color:white;font-style:italic}
.logo span{color:var(--gold)}
.nav{display:flex;gap:10px}
.nav a{text-decoration:none;color:var(--muted);border:1px solid rgba(224,166,59,.12);padding:10px 16px;font-size:11px;text-transform:uppercase;letter-spacing:1.2px}
.nav a.active{color:var(--gold);border-color:rgba(224,166,59,.3)}
.hero{margin-bottom:40px}
.hero h1{font-size:72px;font-weight:400;line-height:1}
.hero h1 span{color:var(--gold);font-style:italic}
.hero p{margin-top:18px;color:var(--muted);line-height:1.9;max-width:760px}
.tabs{display:flex;gap:10px;margin-bottom:36px}
.tab-btn{background:transparent;border:1px solid rgba(224,166,59,.12);color:var(--muted);padding:12px 18px;cursor:pointer;font-size:11px;text-transform:uppercase;letter-spacing:1.2px}
.tab-btn.active{background:var(--gold);color:#1a120b}
.tab-content{display:none}
.tab-content.active{display:block}
.summary-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:26px}
.metric-card{background:var(--panel);border:1px solid var(--border);padding:24px}
.metric-label{color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:18px;font-family:'IBM Plex Mono',monospace}
.metric-value{font-size:52px}
.metric-caption{margin-top:12px;color:var(--muted);line-height:1.7}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.chart-card{background:var(--panel);border:1px solid var(--border);padding:24px}
.chart-card.full{grid-column:1/-1}
.chart-title{margin-bottom:18px;font-size:20px}
canvas{width:100%!important;height:320px!important}
.footer-note{margin-top:50px;color:var(--muted);line-height:1.8;font-size:14px}
@media(max-width:900px){
  .summary-grid,.chart-grid{grid-template-columns:1fr}
  .chart-card.full{grid-column:auto}
  .hero h1{font-size:52px}
}
</style>
</head>

function avg(arr){
  var valid = arr.filter(function(v){return typeof v==='number' && !isNaN(v)});
  if(!valid.length) return '—';
  return (valid.reduce(function(a,b){return a+b},0)/valid.length).toFixed(1);
}
function liftArr(before,after){
  return before.map(function(v,i){return (after[i]||0)-(v||0)});
}
function avgLift(before,after){ return avg(liftArr(before,after)); }

function card(label,value,caption){
  return '<div class="metric-card">'

    +'<div class="metric-caption">'+caption+'</div>'

}

  responsive:true,maintainAspectRatio:false,
  plugins:{legend:{labels:{color:'#d9c5ac'}}},
  scales:{
    x:{ticks:{color:'#8d7258'},grid:{color:'rgba(255,255,255,.03)'}},
    y:{min:1,max:5,ticks:{stepSize:1,color:'#8d7258'},grid:{color:'rgba(255,255,255,.03)'}}

};

function mkChart(id,labels,before,after,color){
  new Chart(document.getElementById(id),{
    type:'line',
    data:{labels:labels,datasets:[
      {label:'before',data:before,borderColor:'rgba(173,132,88,.4)',borderDash:[5,5],borderWidth:2,tension:.35,pointRadius:2},
      {label:'after', data:after, borderColor:color,borderWidth:3,tension:.35,pointRadius:4}
    ]},
    options:OPTS
  });
}
