<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Observations — StateShift</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  background:#120b08;
  color:#f6efe7;
  font-family:Georgia, serif;
}

.container{
  width:1100px;
  max-width:92%;
  margin:auto;
  padding:40px 0 80px;
}

h1{
  font-size:72px;
  margin-bottom:10px;
  font-weight:400;
}

h1 span{
  color:#e0a63b;
  font-style:italic;
}

.sub{
  color:#b48b63;
  margin-bottom:40px;
  letter-spacing:1px;
}

.section{
  margin-bottom:70px;
}

.section-title{
  font-size:28px;
  margin-bottom:24px;
  color:#f2e7d8;
}

.summary{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  margin-bottom:35px;
}

.card{
  border:1px solid rgba(224,166,59,.35);
  padding:22px;
  background:rgba(255,255,255,.02);
}

.label{
  font-size:12px;
  letter-spacing:1px;
  text-transform:uppercase;
  color:#b48b63;
  margin-bottom:10px;
}

.value{
  font-size:38px;
  color:#f6efe7;
}

.note{
  color:#b48b63;
  margin-top:8px;
  font-size:13px;
}

.charts{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:28px;
}

.chart-card{
  border:1px solid rgba(224,166,59,.18);
  padding:22px;
  background:rgba(255,255,255,.015);
}

.chart-title{
  margin-bottom:18px;
  color:#f2e7d8;
  font-size:18px;
}

.scale-note{
  margin-top:50px;
  color:#9d7c58;
  font-size:14px;
}

canvas{
  height:300px !important;
}
</style>
</head>

<body>

<div class="container">

<h1>What the <span>data</span> says</h1>

<div class="sub">
small sample · honest logging · emotional & functional tracking
</div>

<div class="section">

<div class="section-title">Morning Blend</div>

<div class="summary" id="morningSummary"></div>

<div class="charts">

<div class="chart-card">
<div class="chart-title">Focus uplift</div>
<canvas id="focusChart"></canvas>
</div>

<div class="chart-card">
<div class="chart-title">Energy uplift</div>
<canvas id="energyChart"></canvas>
</div>

<div class="chart-card">
<div class="chart-title">Mood uplift</div>
<canvas id="moodChart"></canvas>
</div>

</div>
</div>

<div class="section">

<div class="section-title">Evening Blend</div>

<div class="summary" id="eveningSummary"></div>

<div class="charts">

<div class="chart-card">
<div class="chart-title">Emotional warmth</div>
<canvas id="warmthChart"></canvas>
</div>

<div class="chart-card">
<div class="chart-title">Conversation depth</div>
<canvas id="conversationChart"></canvas>
</div>

<div class="chart-card">
<div class="chart-title">Memorability</div>
<canvas id="memoryChart"></canvas>
</div>

</div>
</div>

<div class="scale-note">
Scale: 1 = low · 3 = balanced baseline · 5 = unusually elevated state
</div>

</div>

<script>

fetch('states.json')
.then(res => res.json())
.then(data => {

const morning = data.filter(d => d.blend === "Morning Blend");
const evening = data.filter(d => d.blend === "Evening Blend");

function avg(arr){
return (arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(1);
}

function uplift(before, after){
return avg(after.map((v,i)=>v-before[i]));
}

document.getElementById("morningSummary").innerHTML = `
<div class="card">
<div class="label">Sessions</div>
<div class="value">${morning.length}</div>
</div>

<div class="card">
<div class="label">Focus uplift</div>
<div class="value">+${uplift(
morning.map(x=>x.focus_before),
morning.map(x=>x.focus_after)
)} / 5</div>
</div>

<div class="card">
<div class="label">Energy uplift</div>
<div class="value">+${uplift(
morning.map(x=>x.energy_before),
morning.map(x=>x.energy_after)
)} / 5</div>
</div>

<div class="card">
<div class="label">Mood uplift</div>
<div class="value">+${uplift(
morning.map(x=>x.mood_before),
morning.map(x=>x.mood_after)
)} / 5</div>
</div>
`;

document.getElementById("eveningSummary").innerHTML = `
<div class="card">
<div class="label">Sessions</div>
<div class="value">${evening.length}</div>
</div>

<div class="card">
<div class="label">Emotional warmth</div>
<div class="value">+${uplift(
evening.map(x=>x.warmth_before),
evening.map(x=>x.warmth_after)
)} / 5</div>
</div>

<div class="card">
<div class="label">Conversation depth</div>
<div class="value">+${uplift(
evening.map(x=>x.conversation_before),
evening.map(x=>x.conversation_after)
)} / 5</div>
</div>

<div class="card">
<div class="label">Memorability</div>
<div class="value">+${uplift(
evening.map(x=>x.memory_before),
evening.map(x=>x.memory_after)
)} / 5</div>
</div>
`;

function makeChart(id, labels, before, after, color){

new Chart(document.getElementById(id),{

type:'line',

data:{
labels,
datasets:[
{
label:'before',
data:before,
borderColor:'rgba(180,139,99,.5)',
borderDash:[5,5],
tension:.4
},
{
label:'after',
data:after,
borderColor:color,
tension:.4
}
]
},

options:{
responsive:true,
plugins:{
legend:{
labels:{
color:'#f6efe7'
}
}
},
scales:{
x:{
ticks:{color:'#c6a57f'},
grid:{color:'rgba(255,255,255,.05)'}
},
y:{
min:1,
max:5,
ticks:{color:'#c6a57f'},
grid:{color:'rgba(255,255,255,.05)'}
}
}
}

});

}

makeChart(
'focusChart',
morning.map(x=>x.date),
morning.map(x=>x.focus_before),
morning.map(x=>x.focus_after),
'#e0a63b'
);

makeChart(
'energyChart',
morning.map(x=>x.date),
morning.map(x=>x.energy_before),
morning.map(x=>x.energy_after),
'#b8f2d0'
);

makeChart(
'moodChart',
morning.map(x=>x.date),
morning.map(x=>x.mood_before),
morning.map(x=>x.mood_after),
'#f6d365'
);

makeChart(
'warmthChart',
evening.map(x=>x.date),
evening.map(x=>x.warmth_before),
evening.map(x=>x.warmth_after),
'#f2a65a'
);

makeChart(
'conversationChart',
evening.map(x=>x.date),
evening.map(x=>x.conversation_before),
evening.map(x=>x.conversation_after),
'#f7c59f'
);

makeChart(
'memoryChart',
evening.map(x=>x.date),
evening.map(x=>x.memory_before),
evening.map(x=>x.memory_after),
'#ffd166'
);

});

</script>

</body>
</html>
