<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Observations — StateShift</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#120b08;
  color:#f6efe7;
  font-family:Georgia, serif;
  overflow-x:hidden;
}

.container{
  width:100%;
  max-width:1280px;
  margin:auto;
  padding:40px 24px 80px;
}

h1{
  font-size:72px;
  margin:0 0 12px;
  font-weight:400;
  line-height:1;
}

h1 span{
  color:#e0a63b;
  font-style:italic;
}

.sub{
  color:#b48b63;
  margin-bottom:42px;
  letter-spacing:.5px;
  font-size:15px;
}

.section{
  margin-bottom:80px;
}

.section-title{
  font-size:38px;
  margin-bottom:26px;
  color:#f2e7d8;
}

.summary{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:18px;
  margin-bottom:34px;
}

.card{
  border:1px solid rgba(224,166,59,.25);
  background:rgba(255,255,255,.02);
  padding:22px;
  min-width:0;
}

.label{
  color:#b48b63;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:1px;
  margin-bottom:12px;
}

.value{
  font-size:44px;
  line-height:1.1;
  word-break:break-word;
}

.charts{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:24px;
  width:100%;
}

.chart-card{
  border:1px solid rgba(224,166,59,.15);
  background:rgba(255,255,255,.015);
  padding:20px;
  min-width:0;
}

.chart-title{
  font-size:20px;
  margin-bottom:16px;
  color:#f2e7d8;
}

.chart-wrap{
  position:relative;
  width:100%;
  height:260px;
}

canvas{
  width:100% !important;
  height:100% !important;
}

.scale-note{
  margin-top:20px;
  color:#9d7c58;
  font-size:14px;
}

@media(max-width:1100px){

.charts{
  grid-template-columns:1fr 1fr;
}

.summary{
  grid-template-columns:1fr 1fr;
}

}

@media(max-width:700px){

h1{
  font-size:46px;
}

.section-title{
  font-size:30px;
}

.summary{
  grid-template-columns:1fr;
}

.charts{
  grid-template-columns:1fr;
}

.value{
  font-size:34px;
}

.container{
  padding:28px 18px 60px;
}

.chart-wrap{
  height:220px;
}

}

</style>
</head>

<body>

<div class="container">

<h1>What the <span>data</span> says</h1>

<div class="sub">
small sample · honest logging · emotional & functional tracking
</div>

<!-- MORNING -->

<div class="section">

<div class="section-title">
Morning Blend
</div>

<div class="summary" id="morningSummary"></div>

<div class="charts">

<div class="chart-card">
<div class="chart-title">Focus uplift</div>
<div class="chart-wrap">
<canvas id="focusChart"></canvas>
</div>
</div>

<div class="chart-card">
<div class="chart-title">Energy uplift</div>
<div class="chart-wrap">
<canvas id="energyChart"></canvas>
</div>
</div>

<div class="chart-card">
<div class="chart-title">Mood uplift</div>
<div class="chart-wrap">
<canvas id="moodChart"></canvas>
</div>
</div>

</div>

</div>

<!-- EVENING -->

<div class="section">

<div class="section-title">
Evening Blend
</div>

<div class="summary" id="eveningSummary"></div>

<div class="charts">

<div class="chart-card">
<div class="chart-title">Emotional warmth</div>
<div class="chart-wrap">
<canvas id="warmthChart"></canvas>
</div>
</div>

<div class="chart-card">
<div class="chart-title">Conversation depth</div>
<div class="chart-wrap">
<canvas id="conversationChart"></canvas>
</div>
</div>

<div class="chart-card">
<div class="chart-title">Memorability</div>
<div class="chart-wrap">
<canvas id="memoryChart"></canvas>
</div>
</div>

</div>

</div>

<div class="scale-note">
Scale: 1 = low · 3 = balanced baseline · 5 = unusually elevated state
</div>

</div>

<script>

fetch('states.json')
.then(response => response.json())
.then(data => {

const morning = data.filter(x => x.blend === "Morning Blend");
const evening = data.filter(x => x.blend === "Evening Blend");

function average(arr){
  return (
    arr.reduce((a,b)=>a+b,0) / arr.length
  ).toFixed(1);
}

function uplift(before, after){
  return (
    after.reduce((sum,val,i)=>sum + (val - before[i]),0)
    / before.length
  ).toFixed(1);
}

document.getElementById("morningSummary").innerHTML = `

<div class="card">
<div class="label">Sessions</div>
<div class="value">${morning.length}</div>
</div>

<div class="card">
<div class="label">Focus uplift</div>
<div class="value">+${uplift(
morning.map(x=>x.focus_before),
morning.map(x=>x.focus_after)
)} / 5</div>
</div>

<div class="card">
<div class="label">Energy uplift</div>
<div class="value">+${uplift(
morning.map(x=>x.energy_before),
morning.map(x=>x.energy_after)
)} / 5</div>
</div>

<div class="card">
<div class="label">Mood uplift</div>
<div class="value">+${uplift(
morning.map(x=>x.mood_before),
morning.map(x=>x.mood_after)
)} / 5</div>
</div>

`;

document.getElementById("eveningSummary").innerHTML = `

<div class="card">
<div class="label">Sessions</div>
<div class="value">${evening.length}</div>
</div>

<div class="card">
<div class="label">Emotional warmth</div>
<div class="value">+${uplift(
evening.map(x=>x.warmth_before),
evening.map(x=>x.warmth_after)
)} / 5</div>
</div>

<div class="card">
<div class="label">Conversation depth</div>
<div class="value">+${uplift(
evening.map(x=>x.conversation_before),
evening.map(x=>x.conversation_after)
)} / 5</div>
</div>

<div class="card">
<div class="label">Memorability</div>
<div class="value">+${uplift(
evening.map(x=>x.memory_before),
evening.map(x=>x.memory_after)
)} / 5</div>
</div>

`;

function createChart(id, labels, beforeData, afterData, color){

new Chart(document.getElementById(id), {

type:'line',

data:{
labels:labels,
datasets:[
{
label:'before',
data:beforeData,
borderColor:'rgba(180,139,99,.45)',
borderDash:[5,5],
tension:.35,
borderWidth:2
},
{
label:'after',
data:afterData,
borderColor:color,
tension:.35,
borderWidth:3
}
]
},

options:{
responsive:true,
maintainAspectRatio:false,

plugins:{
legend:{
labels:{
color:'#f6efe7'
}
}
},

scales:{

x:{
ticks:{
color:'#c6a57f'
},
grid:{
color:'rgba(255,255,255,.04)'
}
},

y:{
min:1,
max:5,
ticks:{
stepSize:1,
color:'#c6a57f'
},
grid:{
color:'rgba(255,255,255,.04)'
}
}

}

}

});

}

createChart(
'focusChart',
morning.map(x=>x.date),
morning.map(x=>x.focus_before),
morning.map(x=>x.focus_after),
'#e0a63b'
);

createChart(
'energyChart',
morning.map(x=>x.date),
morning.map(x=>x.energy_before),
morning.map(x=>x.energy_after),
'#b8f2d0'
);

createChart(
'moodChart',
morning.map(x=>x.date),
morning.map(x=>x.mood_before),
morning.map(x=>x.mood_after),
'#f4d06f'
);

createChart(
'warmthChart',
evening.map(x=>x.date),
evening.map(x=>x.warmth_before),
evening.map(x=>x.warmth_after),
'#f2a65a'
);

createChart(
'conversationChart',
evening.map(x=>x.date),
evening.map(x=>x.conversation_before),
evening.map(x=>x.conversation_after),
'#f7c59f'
);

createChart(
'memoryChart',
evening.map(x=>x.date),
evening.map(x=>x.memory_before),
evening.map(x=>x.memory_after),
'#ffd166'
);

});

</script>

</body>
</html>
