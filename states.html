<script>

const C = {
  text: '#b8a898',
  grid: 'rgba(255,255,255,0.05)',
  font: "'IBM Plex Mono', monospace",
  gold: 'rgba(200,146,42,',
  sage: 'rgba(122,140,110,'
};

Chart.defaults.color = C.text;
Chart.defaults.font.family = C.font;
Chart.defaults.font.size = 10;

async function loadStates() {

  const response = await fetch('states.json');
  const data = await response.json();

  const daily = data.daily;
  const interpretations = data.interpretations || [];

  buildCharts(daily);
  updateKPIs(daily);
  buildInterpretations(interpretations);

}

function buildCharts(daily) {

  const labels = daily.map(d => d.date);

  // Focus Chart
  new Chart(document.getElementById('focusChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: 'before',
          data: daily.map(d => d.fp),
          borderColor: C.gold + '0.3)',
          borderDash: [3,4],
          pointRadius: 2,
          pointBackgroundColor: C.gold + '0.3)',
          tension: 0.4,
          fill: false,
          borderWidth: 1
        },
        {
          label: 'after',
          data: daily.map(d => d.fpo),
          borderColor: C.gold + '0.85)',
          pointRadius: 3,
          pointBackgroundColor: C.gold + '0.85)',
          tension: 0.4,
          fill: false,
          borderWidth: 1.5
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          display: true,
          labels: {
            color: C.text,
            boxWidth: 10,
            font: { family: C.font, size: 9 }
          }
        },
        tooltip: {
          backgroundColor: 'rgba(45,26,13,0.95)',
          borderColor: C.gold + '0.3)',
          borderWidth: 1,
          titleFont: { family: C.font, size: 9 },
          bodyFont: { family: C.font, size: 9 },
          titleColor: '#d4a853',
          bodyColor: '#b8a898',
          padding: 8,
          callbacks: {
            afterBody: (items) => [
              `session: ${daily[items[0].dataIndex].blend}`
            ]
          }
        }
      },
      scales: {
        x: {
          grid: { color: C.grid },
          ticks: {
            color: C.text,
            maxRotation: 0,
            font: { size: 9 }
          }
        },
        y: {
          grid: { color: C.grid },
          ticks: { color: C.text },
          min: 0,
          max: 10
        }
      }
    }
  });

  // Anxiety Chart
  const anxDeltas = daily.map(d => d.ap - d.apo);
  const anxColors = anxDeltas.map(d =>
    d > 0
      ? C.sage + '0.7)'
      : 'rgba(170,70,30,0.6)'
  );

  new Chart(document.getElementById('anxChart'), {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: 'reduction',
        data: anxDeltas,
        backgroundColor: anxColors,
        borderWidth: 0
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(45,26,13,0.95)',
          borderColor: C.gold + '0.3)',
          borderWidth: 1,
          titleFont: { family: C.font, size: 9 },
          bodyFont: { family: C.font, size: 9 },
          titleColor: '#d4a853',
          bodyColor: '#b8a898',
          padding: 8,
          callbacks: {
            label: (item) =>
              `reduced by ${item.raw} point${item.raw !== 1 ? 's' : ''}`
          }
        }
      },
      scales: {
        x: {
          grid: { color: C.grid },
          ticks: {
            color: C.text,
            maxRotation: 0,
            font: { size: 9 }
          }
        },
        y: {
          grid: { color: C.grid },
          ticks: { color: C.text },
          min: -2,
          max: 5
        }
      }
    }
  });

  // Energy Chart
  new Chart(document.getElementById('energyChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: 'before',
          data: daily.map(d => d.ep),
          borderColor: 'rgba(122,140,110,0.3)',
          borderDash: [3,4],
          pointRadius: 2,
          pointBackgroundColor: 'rgba(122,140,110,0.3)',
          tension: 0.4,
          fill: false,
          borderWidth: 1
        },
        {
          label: 'after',
          data: daily.map(d => d.epo),
          borderColor: 'rgba(122,140,110,0.9)',
          pointRadius: 3,
          pointBackgroundColor: 'rgba(122,140,110,0.9)',
          tension: 0.4,
          fill: false,
          borderWidth: 1.5
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          display: true,
          labels: {
            color: C.text,
            boxWidth: 10,
            font: { family: C.font, size: 9 }
          }
        }
      },
      scales: {
        x: {
          grid: { color: C.grid },
          ticks: {
            color: C.text,
            maxRotation: 0,
            font: { size: 9 }
          }
        },
        y: {
          grid: { color: C.grid },
          ticks: { color: C.text },
          min: 0,
          max: 10
        }
      }
    }
  });

  // Mood Chart
  new Chart(document.getElementById('moodChart'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: 'before',
          data: daily.map(d => d.mp),
          borderColor: 'rgba(180,130,80,0.35)',
          borderDash: [3,4],
          pointRadius: 2,
          pointBackgroundColor: 'rgba(180,130,80,0.35)',
          tension: 0.4,
          fill: false,
          borderWidth: 1
        },
        {
          label: 'after',
          data: daily.map(d => d.mpo),
          borderColor: 'rgba(200,146,42,0.9)',
          backgroundColor: 'rgba(200,146,42,0.06)',
          pointRadius: 3,
          pointBackgroundColor: 'rgba(200,146,42,0.9)',
          tension: 0.4,
          fill: '-1',
          borderWidth: 1.5
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          display: true,
          labels: {
            color: C.text,
            boxWidth: 10,
            font: { family: C.font, size: 9 }
          }
        }
      },
      scales: {
        x: {
          grid: { color: C.grid },
          ticks: {
            color: C.text,
            maxRotation: 0,
            font: { size: 9 }
          }
        },
        y: {
          grid: { color: C.grid },
          ticks: { color: C.text },
          min: 0,
          max: 10
        }
      }
    }
  });

}

function updateKPIs(daily) {

  document.getElementById('k-sessions').textContent = daily.length;

  const focusDeltas = daily.map(d => d.fpo - d.fp);
  const avgFocus =
    (focusDeltas.reduce((a,b)=>a+b,0)/focusDeltas.length).toFixed(1);

  const anxDeltas = daily.map(d => d.ap - d.apo);
  const avgAnx =
    (anxDeltas.reduce((a,b)=>a+b,0)/anxDeltas.length).toFixed(1);

  const energyDeltas = daily.map(d => d.epo - d.ep);
  const avgEnergy =
    (energyDeltas.reduce((a,b)=>a+b,0)/energyDeltas.length).toFixed(1);

  const moodDeltas = daily.map(d => d.mpo - d.mp);
  const avgMood =
    (moodDeltas.reduce((a,b)=>a+b,0)/moodDeltas.length).toFixed(1);

  document.getElementById('k-focus').textContent = avgFocus;
  document.getElementById('k-anxiety').textContent = Math.abs(avgAnx);
  document.getElementById('k-energy').textContent = avgEnergy;
  document.getElementById('k-mood').textContent = avgMood;

}

function buildInterpretations(interpretations) {

  document.getElementById('interpretEntries').innerHTML =
    interpretations.map((item, i) => `
      <div class="interpret-entry">
        <div class="interpret-date">${item.date}</div>
        <div class="interpret-text">${item.text}</div>
      </div>
      ${i < interpretations.length - 1
        ? '<div class="interpret-divider"></div>'
        : ''}
    `).join('');

}

loadStates();

</script>
