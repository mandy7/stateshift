<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Observations — StateShift</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  background:#120b08;
  color:#f6efe7;
  font-family:Georgia, serif;
}

.container{
  width:1100px;
  max-width:92%;
  margin:auto;
  padding:40px 0 80px;
}

h1{
  font-size:68px;
  margin-bottom:10px;
  font-weight:400;
}

h1 span{
  color:#e0a63b;
  font-style:italic;
}

.sub{
  color:#b48b63;
  margin-bottom:40px;
  letter-spacing:1px;
}

.section{
  margin-bottom:70px;
}

.section-title{
  font-size:28px;
  margin-bottom:24px;
  color:#f2e7d8;
}

.summary{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-bottom:34px;
}

.card{
  border:1px solid rgba(224,166,59,.28);
  padding:16px 18px;
  background:rgba(255,255,255,.018);
}

.label{
  font-size:11px;
  letter-spacing:1px;
  text-transform:uppercase;
  color:#b48b63;
  margin-bottom:8px;
}

.value{
  font-size:24px;
  color:#f6efe7;
  line-height:1.1;
}

.note{
  color:#8f7253;
  margin-top:4px;
  font-size:11px;
}

.charts{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:24px;
}

.chart-card{
  border:1px solid rgba(224,166,59,.14);
  padding:20px;
  background:rgba(255,255,255,.012);
}

.chart-title{
  margin-bottom:16px;
  color:#f2e7d8;
  font-size:17px;
}

.scale-note{
  margin-top:50px;
  color:#9d7c58;
  font-size:13px;
}

canvas{
  height:280px !important;
}

@media(max-width:900px){

  .summary{
    grid-template-columns:1fr 1fr;
  }

  .charts{
    grid-template-columns:1fr;
  }

  h1{
    font-size:48px;
  }

}
</style>
</head>

<body>

<div class="container">

<h1>What the <span>data</span> says</h1>

<div class="sub">
small sample · honest logging · emotional & functional tracking
</div>

<!-- MORNING -->

<section class="section">

<div class="section-title">
Morning Blend
</div>

<div class="summary" id="morningSummary"></div>

<div class="charts">

<div class="chart-card">
<div class="chart-title">Focus uplift</div>
<div class="chart-wrap">
<canvas id="focusChart"></canvas>
</div>
</div>

<div class="chart-card">
<div class="chart-title">Energy uplift</div>
<div class="chart-wrap">
<canvas id="energyChart"></canvas>
</div>
</div>

<div class="chart-card full">
<div class="chart-title">Mood uplift</div>
<div class="chart-wrap">
<canvas id="moodChart"></canvas>
</div>
</div>

</div>

</section>

<!-- EVENING -->

<section class="section">

<div class="section-title">
Evening Blend
</div>

<div class="summary" id="eveningSummary"></div>

<div class="charts">

<div class="chart-card">
<div class="chart-title">Emotional warmth</div>
<div class="chart-wrap">
<canvas id="warmthChart"></canvas>
</div>
</div>

<div class="chart-card">
<div class="chart-title">Conversation depth</div>
<div class="chart-wrap">
<canvas id="conversationChart"></canvas>
</div>
</div>

<div class="chart-card full">
<div class="chart-title">Memorability</div>
<div class="chart-wrap">
<canvas id="memoryChart"></canvas>
</div>
</div>

</div>

</section>

<div class="scale-note">
Scale: 1 = low · 3 = balanced baseline · 5 = unusually elevated
</div>

</div>

<script>

fetch('states.json')
.then(r => r.json())
.then(data => {

const morning = data.filter(x => x.blend === "Morning Blend");
const evening = data.filter(x => x.blend === "Evening Blend");

function avgDiff(before, after){

let total = 0;

after.forEach((v,i)=>{
total += (v - before[i]);
});

return (total / after.length).toFixed(1);

}

document.getElementById('morningSummary').innerHTML = `

<div class="card">
<div class="label">Sessions</div>
<div class="value">${morning.length}</div>
</div>

<div class="card">
<div class="label">Focus uplift</div>
<div class="value">${avgDiff(
morning.map(x=>x.focus_before),
morning.map(x=>x.focus_after)
)}</div>
</div>

<div class="card">
<div class="label">Energy uplift</div>
<div class="value">↑ {avgDiff(
morning.map(x=>x.energy_before),
morning.map(x=>x.energy_after)
)}</div>
</div>

<div class="card">
<div class="label">Mood uplift</div>
<div class="value">↑ {avgDiff(
morning.map(x=>x.mood_before),
morning.map(x=>x.mood_after)
)}</div>
</div>

`;

document.getElementById('eveningSummary').innerHTML = `

<div class="card">
<div class="label">Sessions</div>
<div class="value">${evening.length}</div>
</div>

<div class="card">
<div class="label">Emotional warmth</div>
<div class="value">↑ {avgDiff(
evening.map(x=>x.warmth_before),
evening.map(x=>x.warmth_after)
)}</div>
</div>

<div class="card">
<div class="label">Conversation depth</div>
<div class="value">↑ {avgDiff(
evening.map(x=>x.conversation_before),
evening.map(x=>x.conversation_after)
)}</div>
</div>

<div class="card">
<div class="label">Memorability</div>
<div class="value">↑ {avgDiff(
evening.map(x=>x.memory_before),
evening.map(x=>x.memory_after)
)}</div>
</div>

`;

function makeChart(id, labels, beforeData, afterData, color){

new Chart(document.getElementById(id),{

type:'line',

data:{
labels:labels,
datasets:[
{
label:'before',
data:beforeData,
borderColor:'rgba(180,139,99,.45)',
borderDash:[5,5],
borderWidth:2,
tension:.35
},
{
label:'after',
data:afterData,
borderColor:color,
borderWidth:3,
tension:.35
}
]
},

options:{

responsive:true,
maintainAspectRatio:false,

plugins:{
legend:{
labels:{
color:'#f3ebe0',
font:{
size:11
}
}
}
},

scales:{

x:{
ticks:{
color:'#caa57a',
font:{
size:10
}
},
grid:{
color:'rgba(255,255,255,.03)'
}
},

y:{
min:1,
max:5,
ticks:{
stepSize:1,
color:'#caa57a',
font:{
size:10
}
},
grid:{
color:'rgba(255,255,255,.03)'
}
}

}

}

});

}

makeChart(
'focusChart',
morning.map(x=>x.date),
morning.map(x=>x.focus_before),
morning.map(x=>x.focus_after),
'#e0a63b'
);

makeChart(
'energyChart',
morning.map(x=>x.date),
morning.map(x=>x.energy_before),
morning.map(x=>x.energy_after),
'#bdf4dd'
);

makeChart(
'moodChart',
morning.map(x=>x.date),
morning.map(x=>x.mood_before),
morning.map(x=>x.mood_after),
'#f2d15f'
);

makeChart(
'warmthChart',
evening.map(x=>x.date),
evening.map(x=>x.warmth_before),
evening.map(x=>x.warmth_after),
'#ffb067'
);

makeChart(
'conversationChart',
evening.map(x=>x.date),
evening.map(x=>x.conversation_before),
evening.map(x=>x.conversation_after),
'#f7c59f'
);

makeChart(
'memoryChart',
evening.map(x=>x.date),
evening.map(x=>x.memory_before),
evening.map(x=>x.memory_after),
'#ffd166'
);

});

</script>

</body>
</html>
