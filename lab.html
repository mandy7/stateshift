<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Test</title>

<style>
body{
  background:#111;
  color:white;
  font-family:Arial;
  padding:40px;
}
.card{
  border:1px solid #444;
  padding:20px;
  margin-bottom:20px;
}
</style>
</head>

<body>

<h1>Lab Test</h1>

<div id="app"></div>

<script>

const entries = [
  {
    id:'1',
    title:'Test Entry',
    body:'This is working.',
    observations:[
      'Observation one',
      'Observation two'
    ]
  }
];

function buildEntry(entry){

  let obs = '';

  entry.observations.forEach(item => {
    obs += '<li>' + item + '</li>';
  });

  return `
    <div class="card">

      <h2>${entry.title}</h2>

      <p>${entry.body}</p>

      <ul>
        ${obs}
      </ul>

    </div>
  `;
}

document.getElementById('app').innerHTML =
  entries.map(buildEntry).join('');

</script>

</body>
</html>
